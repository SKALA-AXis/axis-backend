spring:
  application:
    name: ${SPRING_APPLICATION_NAME:axis-backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # SSL·prepareThreshold 등 옵션은 env 쪽에서 URL 쿼리스트링으로 직접 지정한다.
    # cloud: ...?sslmode=require&prepareThreshold=0  /  local 컨테이너: 옵션 없이 사용
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/axis}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase pooler 호환 설정 (5432 직접 연결 시에도 안전)
      # chatty 대시보드(새로고침당 ~15 API)의 동시 조회 천장 완화. 최악(HPA max 4 replica)
      # × 20 = 80 < postgres max_connections(100) — cron/admin 여유 확보.
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true              # Supabase에 이미 스키마가 있을 경우 V1을 baseline으로 처리
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false                    # V 번호 단조 증가만 허용 — 순서 어긋나면 빌드 실패
    placeholders:
      # beforeMigrate__prod_guard.sql 가드용. 'cluster' 는 prod 프로필만 가진다 —
      # 운영 DB(axis.environment='prod' 마커)에 그 외 값으로 migrate 시도 시 차단.
      axis_migrate_source: local

ai:
  server:
    base-url: ${AI_SERVER_URL:http://localhost:8001}

axis:
  auth:
    enforce: ${AXIS_AUTH_ENFORCE:true}
    allowed-email-domains: ${AXIS_AUTH_ALLOWED_EMAIL_DOMAINS:sk.com}
    jwt-secret: ${AXIS_AUTH_JWT_SECRET:axis-local-dev-secret-change-me-32-bytes-minimum}
    access-token-minutes: ${AXIS_AUTH_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${AXIS_AUTH_REFRESH_TOKEN_DAYS:14}
    email-verification-minutes: ${AXIS_AUTH_EMAIL_VERIFICATION_MINUTES:60}
    email-verification-delivery: ${AXIS_AUTH_EMAIL_VERIFICATION_DELIVERY:ses}
    max-failed-login-count: ${AXIS_AUTH_MAX_FAILED_LOGIN_COUNT:5}
    lock-minutes: ${AXIS_AUTH_LOCK_MINUTES:10}
    refresh-cookie-name: ${AXIS_AUTH_REFRESH_COOKIE_NAME:axis_refresh}
    refresh-cookie-secure: ${AXIS_AUTH_REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${AXIS_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    app-base-url: ${AXIS_APP_BASE_URL:http://localhost:3100}
    bootstrap-admin-emails: ${BOOTSTRAP_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${AXIS_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  share:
    base-url: ${AXIS_SHARE_BASE_URL:https://axis.local}
  scheduler:
    enabled: ${AXIS_SCHEDULER_ENABLED:false}
    ingestion-peer-ids: ${AXIS_SCHEDULER_INGESTION_PEER_IDS:samsung_sds,lg_cns,hyundai_autoever,posco_dx,nvidia,apple,microsoft,google,amazon,meta}
    today-insight-cron: "${AXIS_SCHEDULER_TODAY_INSIGHT_CRON:0 10 8 * * MON-FRI}"
    cron-internal-token: ${CRON_INTERNAL_TOKEN:}
    # prod(application-prod.yml) 에서 true — 토큰 미설정 시 Cron trigger/delivery 거부.
    cron-auth-required: ${AXIS_SCHEDULER_CRON_AUTH_REQUIRED:false}
  keyword-graph:
    # axis-cron-ingestion-a 가 매시 정각에 카드뉴스 파이프라인을 트리거하므로
    # 기본은 완료 여유를 둔 매시 10분 캐시 갱신이다.
    refresh-cron: "${AXIS_KEYWORD_GRAPH_REFRESH_CRON:0 10 * * * *}"
  agent-test:
    enabled: ${AXIS_AGENT_TEST_ENABLED:false}
  fixtures:
    enabled: ${AXIS_FIXTURES_ENABLED:false}
  image:
    # 카드 뉴스 이미지 파일이 저장된 공유 볼륨의 마운트 경로.
    # axis-ai (ImageFetchAgent) 가 쓰고, axis-backend 가 read-only 로 서빙.
    # 컨테이너에서는 IMAGE_STORAGE_PATH 환경변수가 주입되며, 기본값은 /data/images.
    storage-path: ${IMAGE_STORAGE_PATH:/data/images}
  notification:
    important-keywords: ${AXIS_NOTIFICATION_IMPORTANT_KEYWORDS:수주,계약,실적,투자}
    max-keywords: ${AXIS_NOTIFICATION_MAX_KEYWORDS:20}
    max-keyword-length: ${AXIS_NOTIFICATION_MAX_KEYWORD_LENGTH:30}
  alert:
    # 대형 이벤트(수주·파트너십·M&A) 1회성 이메일 알림. exposure 점수는 정밀도가 낮아
    # event-types(1차) AND (importance ≥ min-score OR financial_refs 존재)(2차) 게이트로만 발송.
    # 수신자는 일일 브리핑과 공유(briefing.recipients). 발송은 SesMailService(SES+IRSA)만.
    enabled: ${AXIS_ALERT_ENABLED:true}
    event-types: ${AXIS_ALERT_EVENT_TYPES:ma,contract,partnership}
    min-score: ${AXIS_ALERT_MIN_SCORE:0.65}
    scan-lookback-minutes: ${AXIS_ALERT_SCAN_LOOKBACK_MINUTES:90}
    # 자동 스캔 — 매시 :15(07–22시), 야간 셧다운(23–07 KST) 회피.
    scan-cron: "${AXIS_ALERT_SCAN_CRON:0 15 7-22 * * *}"
    # 보조 dedup — 같은 peer+event_type 재발송 억제 일수. 0=비활성(cluster_id dedup 만).
    peer-event-suppress-days: ${AXIS_ALERT_PEER_EVENT_SUPPRESS_DAYS:0}

# 이메일 발송 — AWS SES V2 SDK + IRSA (ses-mailer-sa) — Slack 폐기 (v4).
# 자세한 spec: axis-infra/docs/SES_INTEGRATION.md
aws:
  region: ${AWS_REGION:ap-northeast-2}

mail:
  from: ${MAIL_FROM:noreply@skala-ai.com}

briefing:
  # comma-separated 수신자 목록. cluster 의 axis-config 의 BRIEFING_RECIPIENTS envFrom 으로 주입.
  # axis-ai 응답의 recipients 가 비어있을 때만 사용 (BriefingService.resolveRecipients).
  recipients: ${BRIEFING_RECIPIENTS:}
  time: "08:30"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}?sslmode=require
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase pooler 호환 설정 (5432 직접 연결 시에도 안전)
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true              # Supabase에 이미 스키마가 있을 경우 V1을 baseline으로 처리
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false                    # V 번호 단조 증가만 허용 — 순서 어긋나면 빌드 실패

ai:
  server:
    base-url: ${AI_SERVER_URL:http://localhost:8001}

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}
  briefing-time: "08:30"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health

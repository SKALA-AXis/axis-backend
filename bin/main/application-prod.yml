spring:
  # cluster pod (SPRING_PROFILES_ACTIVE=prod from axis-config ConfigMap) 에서 Flyway 가
  # 시작 시 자동 migrate 수행. application.yml 의 default 상속이 아닌 명시 보강 —
  # 누가 default 를 false 로 바꿔도 cluster 는 안전 (defense in depth).
  flyway:
    enabled: true
  jpa:
    show-sql: false
logging:
  level:
    # baseline — 자잘한 INFO 로 인한 로그 폭증 차단
    com.skala.axis: WARN
    # 운영 핵심 흐름 (SES messageId, 브리핑 발송 결과, 스케줄러 발사) 는
    # 디버깅·SR 추적에 필수라 INFO 로 격상. 매니저 가이드 위반 시 즉시 추적 필요.
    com.skala.axis.service.SesMailService: INFO
    com.skala.axis.service.BriefingService: INFO
    com.skala.axis.config.SchedulerConfig: INFO

axis:
  auth:
    enforce: ${AXIS_AUTH_ENFORCE:true}
    email-verification-delivery: ${AXIS_AUTH_EMAIL_VERIFICATION_DELIVERY:ses}
    refresh-cookie-secure: ${AXIS_AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${AXIS_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    app-base-url: ${AXIS_APP_BASE_URL:${VITE_API_BASE_URL:https://axis.skala.ai}}
